# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices, not vulnerabilities, on font-shaping
    # crates pulled in transitively by resvg/usvg/eframe — there is no
    # alternative version to move to until those upstreams migrate. tangt only
    # ever feeds them SVG it generated itself (see SECURITY.md), so neither is
    # on an untrusted-input path. Revisit when resvg/eframe update.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via resvg/usvg/eframe" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via usvg" },
]

[bans]
multiple-versions = "allow" # resvg and svg2pdf legitimately pin different usvg
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "BSL-1.0",
]
