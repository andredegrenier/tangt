# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow" # resvg and svg2pdf legitimately pin different usvg
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "BSL-1.0",
]
