name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tangt-windows-x86_64
            binary: tangt.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tangt-macos-arm64
            binary: tangt
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tangt-macos-x86_64
            binary: tangt
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tangt-linux-x86_64
            binary: tangt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked --target ${{ matrix.target }} -p tangt-app
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}/
          cp README.md LICENSE examples/website-redesign.tangt dist/${{ matrix.artifact }}/
          cd dist && zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}/
          Copy-Item README.md,LICENSE,examples/website-redesign.tangt dist/${{ matrix.artifact }}/
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip
      - name: Checksum (unix)
        if: runner.os != 'Windows'
        run: cd dist && shasum -a 256 ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
      - name: Checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/${{ matrix.artifact }}.zip -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF: a trailing \r makes the filename unmatchable
          # for `shasum -c` on macOS/Linux.
          [IO.File]::WriteAllText("dist/${{ matrix.artifact }}.zip.sha256", "$h  ${{ matrix.artifact }}.zip`n")
      # Signed provenance: `gh attestation verify <zip> -R andredegrenier/tangt`
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/${{ matrix.artifact }}.zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
          generate_release_notes: true
